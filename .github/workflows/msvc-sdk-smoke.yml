name: MSVC SDK Link Smoke

on:
  workflow_dispatch:
    inputs:
      sdk_version:
        description: 'Halla-WebRTC-Builds release tag'
        required: true
        default: 'v0.1.3'

permissions:
  contents: read

jobs:
  msvc-link-smoke:
    name: MSVC link smoke
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Resolve SDK version
        id: vars
        shell: pwsh
        run: "echo \"tag=${{ github.event.inputs.sdk_version }}\" >> $env:GITHUB_OUTPUT"

      - name: Download SDK
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SDK_VERSION: ${{ steps.vars.outputs.tag }}
        run: |
          $url = "https://github.com/GroupHalla/Halla-WebRTC-Builds/releases/download/$env:SDK_VERSION/halla-webrtc-windows-x64-$env:SDK_VERSION.zip"
          Invoke-WebRequest -Headers @{ Authorization = "Bearer $env:GH_TOKEN" } -Uri $url -OutFile sdk.zip
          Expand-Archive sdk.zip -DestinationPath sdk -Force
          Get-ChildItem sdk -Recurse | Select-Object -First 20 | ForEach-Object { Write-Host $_.FullName }

      - name: Setup MSVC dev shell
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Compile and link smoke
        shell: pwsh
        run: |
          $inc = "sdk"
          $lib = "sdk\lib\windows-x64\webrtc.lib"
          cl /nologo /std:c++20 /EHsc /DWEBRTC_WIN=1 /DNOMINMAX /DWIN32_LEAN_AND_MEAN `
            /I "$inc\include" `
            /I "$inc\include\third_party\abseil-cpp" `
            /I "$inc\include\third_party\libyuv\include" `
            samples\factory_smoke.cpp `
            /link "$lib" ws2_32.lib winmm.lib secur32.lib crypt32.lib iphlpapi.lib dmoguids.lib strmiids.lib msdmo.lib wmcodecdspuuid.lib ole32.lib oleaut32.lib user32.lib advapi32.lib /out:webrtc_factory_smoke.exe
          .\webrtc_factory_smoke.exe
