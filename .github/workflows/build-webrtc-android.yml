name: Build Android external-audio SDK

on:
  push:
    branches: [main]
    tags: ['android-v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android-sdk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3

      - name: Validate Android SDK version and tag
        shell: bash
        run: |
          set -euo pipefail
          version="$(tr -d '\r\n ' < ANDROID_VERSION)"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          if [[ "${GITHUB_REF_TYPE:-}" == "tag" && "$GITHUB_REF_NAME" != "android-v$version" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match ANDROID_VERSION=$version" >&2
            exit 1
          fi

      - name: Test, lint, build and generate Maven publication
        run: |
          ./gradlew --no-daemon \
            :android-sdk:testDebugUnitTest \
            :android-sdk:lintDebug \
            :android-sdk:assembleRelease \
            :android-sdk:publishReleasePublicationToMavenRepository

      - name: Prepare release artifacts
        shell: bash
        run: |
          set -euo pipefail
          version="$(tr -d '\r\n ' < ANDROID_VERSION)"
          base="external-audio-android-$version"
          published="android-sdk/build/repo/com/halla/webrtc/external-audio-android/$version"
          mkdir -p dist
          cp android-sdk/build/outputs/aar/android-sdk-release.aar "dist/$base.aar"
          cp "$published/external-audio-android-$version-sources.jar" "dist/$base-sources.jar"
          cp "$published/external-audio-android-$version.pom" "dist/$base.pom"
          (cd dist && sha256sum "$base.aar" "$base-sources.jar" "$base.pom" > "$base.sha256")

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: halla-webrtc-android-external-audio
          if-no-files-found: error
          path: dist/*

  release:
    if: github.ref_type == 'tag'
    needs: build-android-sdk
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: halla-webrtc-android-external-audio
          path: dist
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Halla WebRTC Android External Audio ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: dist/*
